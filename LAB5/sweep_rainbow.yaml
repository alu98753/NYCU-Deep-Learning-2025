# sweep_rainbow.yaml
# Wandb sweep configuration for optimizing DDQN+PER+N-step on Pong

program: dqn_task3_rainbow_reward_shape.py # <-- [重要] 請將這裡換成你實際的 Python 腳本檔名
method: bayes             # 使用貝葉斯優化來尋找最佳參數
project: DLP-Lab5-Rainbow 
name: "${batch_size}_${discount_factor}_${lr}_${replay-start-size}_${target-update-frequency}_${n-step}"          
metric:
  name: Reward/Evaluation Reward  # <-- [重要] 確認這與你 Wandb log 中的評估指標名稱完全一致
  goal: maximize          # 目標是最大化評估獎勵
parameters:
  # --- 固定參數 (Fixed Parameters for this Sweep) ---
  episodes:
    value: 640             # 固定 Epoch/Episodes 數量 (根據你的要求)
  env-name:
    value: "ALE/Pong-v5"  # 固定環境
  seed:
    value: 777            # 固定隨機種子 (方便比較，如果需要可以稍後 sweep seed)
  frame-stack:
    value: 4              # 固定 Frame Stack
  memory-size:
    value: 100000         # 固定 Buffer 大小 (100k)
  replay-start-size:
    values: [10000,20000]          # 固定 Replay Buffer 啟動大小 (較小以提早學習)
  beta:                   # PER 初始 beta 值固定
    value: 0.4
  total-train-steps:      # PER Beta 退火總步數 (基於 64 episodes 粗略估計)
    value: 640000          # (例如: 64eps * ~1250 steps/ep after warmup) - 你可以根據實際情況調整

  # C51 參數 (在此配置下未使用，但 argparser 需要)
  v-min:
    value: -5.0
  v-max:
    value: 5.0
  atom-size:
    value: 51
  gradient-clip-value:    # 固定梯度裁剪值
    value: 10.0
  reward-scale:           # PER 獎勵縮放因子固定
    value: 1.0
  max-episode-steps:      # 固定單一 episode 最大步數
    value: 5000

  # --- 探索參數 (Parameters to Sweep) ---
  lr:
    distribution: log_uniform_values
    min: 5e-5             # 學習率下限 (接近 6.25e-5)
    max: 4e-4             # 學習率上限 (稍微激進一點)
  discount-factor:        # Gamma (探索短期 vs 長期回報)
    values: [0.95, 0.97, 0.99]
  n-step:                 # N-step (探索不同步數的回報)
    values: [1, 3, 5]
  target-update-frequency: # Target 網路更新頻率 (訓練步數)
    values: [4000, 8000] # 探索更新速度 vs 穩定性
  batch-size:             # Batch 大小
    values: [32, 64]      # 嘗試標準和稍大的 Batch Size
  alpha:                  # PER Alpha (優先級強度)
    value: 0.6
  # Epsilon-Greedy 參數 (因為 use_noisy=False)
  epsilon-decay-steps:    # Epsilon 退火步數 (環境步數)
    value: 200000 # 探索不同的退火速度
  epsilon-final:          # 最終 Epsilon 值
    value: 0.01

# --- 可選：提前終止設定 (Optional: Early Termination) ---
 
max_parallel_jobs: 1