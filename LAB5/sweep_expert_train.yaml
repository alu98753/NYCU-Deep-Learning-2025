# sweep_expert_train.yaml
# Goal: Find hyperparameters to reliably train Pong expert model to stable +21 score
# Method: Bayesian Optimization for efficient search
# Architecture: Dueling+C51+DDQN+N-step+PER (No DQFD)

program: task3_pretrain_extract_rainbow.py
project: DLP-Lab5-DuelingC51-Pong
method: bayes # Bayesian optimization is generally efficient
metric:
  name: Evaluation/Raw Reward # Primary metric to maximize
  goal: maximize

parameters:
  # --- Parameters to Sweep (Focus on stability & convergence) ---
  lr: # Learning Rate
    distribution: log_uniform_values
    min: 4e-5   # Slightly narrower range around the common 6.25e-5
    max: 1e-4
  epsilon-decay-steps: # Exploration duration (decision steps)
    distribution: categorical
    values: [500000] #750000 Longer decay periods for stability
  target-update-frequency: # Target network update frequency (training steps)
    distribution: categorical
    values: [4000, 8000, 12000] # Slower updates (8k = 32k env steps) promote stability
  replay-start-size: # When to start learning (decision steps)
    distribution: categorical
    values: [20000, 40000] # Standard start sizes, leaning towards more initial data

  # --- Fixed Parameters (Based on stable practices & Pong specifics) ---
  env-name:
    value: "ALE/Pong-v5"
  frame-stack:
    value: 4
  frame-skip:
    value: 4
  max-episode-steps:
    value: 6750 # 27000 // 4 env steps limit seems reasonable
  train-per-decision-step:
    value: 1
  discount-factor:
    value: 0.99
  batch-size:
    value: 32
  grad-clip:
    value: 10.0
  num-atoms:
    value: 51
  vmin:
    value: -5.0 # Adjusted for Pong n_step=3
  vmax:
    value: 5.0 # Adjusted for Pong n_step=3
  epsilon-start:
    value: 1.0
  epsilon-min:
    value: 0.01 # Standard final exploration value
  memory-size:
    value: 100000 # Hardware constraint compromise
  per-alpha:
    value: 0.5 # Standard PER value
  per-beta0:
    value: 0.4 # Standard PER value
  per-beta-steps:
    value: 7000000 # Anneal beta over estimated ~10 hours of training steps
  n-step:
    value: 3 # Standard Rainbow value

  # --- Parameters NOT USED (Ensure DQFD is OFF) ---
  # These should NOT be passed or should be set to None/False in the script default
  # load-expert-data: {value: null} # Or simply don't pass the argument
  # pretrain-steps: {value: 0}
  # lambda1: {value: 0}
  # margin: {value: 0}
  # expert-epsilon: {value: 0}
  # etc.

  # --- Logging / Saving Fixed ---
  # episodes: {value: 8000} # Set high enough for 10 hours
  # save-dir: # Needs unique names per run, set via command line or wandb integration
  # wandb-project: {value: "Pong-Expert-Train-Stable21"}
  # wandb-run-name: # Will be generated by sweep
  eval-interval: {value: 50} # Evaluate less frequently than fast runs
  save-frequency: {value: 250000} # Save checkpoints reasonably often